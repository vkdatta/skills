name: Release and Publish

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Check release history
        id: release_history
        shell: bash
        run: |
          if git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | grep -q .; then
            echo "has_release_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_release_tag=false" >> "$GITHUB_OUTPUT"
            echo "No SemVer release tag exists yet. Skipping automatic release."
            echo "Bootstrap @vkdatta/skills once, create/push v0.0.1, then normal pushes will release automatically."
          fi

      - name: Calculate next SemVer tag
        if: steps.release_history.outputs.has_release_tag == 'true'
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
          fetch_all_tags: true
          dry_run: true

      - name: Validate generated tag
        if: steps.release_history.outputs.has_release_tag == 'true'
        env:
          NEW_TAG: ${{ steps.tag_version.outputs.new_tag }}
        shell: bash
        run: |
          if [[ ! "$NEW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid generated tag: $NEW_TAG" >&2
            exit 1
          fi
          echo "Release tag: $NEW_TAG"

      - name: Set package version and update lockfile
        if: steps.release_history.outputs.has_release_tag == 'true'
        env:
          RELEASE_VERSION: ${{ steps.tag_version.outputs.new_version }}
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version --ignore-scripts

      - name: Install dependencies
        if: steps.release_history.outputs.has_release_tag == 'true'
        run: npm ci

      - name: Test package
        if: steps.release_history.outputs.has_release_tag == 'true'
        run: npm test

      - name: Validate npm package
        if: steps.release_history.outputs.has_release_tag == 'true'
        run: npm pack --dry-run

      - name: Verify tag and package versions match
        if: steps.release_history.outputs.has_release_tag == 'true'
        env:
          NEW_TAG: ${{ steps.tag_version.outputs.new_tag }}
          RELEASE_VERSION: ${{ steps.tag_version.outputs.new_version }}
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          LOCK_VERSION="$(node -p "require('./package-lock.json').version")"
          TAG_VERSION="${NEW_TAG#v}"
          [[ "$PACKAGE_VERSION" == "$RELEASE_VERSION" ]] || { echo "package.json=$PACKAGE_VERSION, expected=$RELEASE_VERSION" >&2; exit 1; }
          [[ "$LOCK_VERSION" == "$RELEASE_VERSION" ]] || { echo "package-lock.json=$LOCK_VERSION, expected=$RELEASE_VERSION" >&2; exit 1; }
          [[ "$TAG_VERSION" == "$RELEASE_VERSION" ]] || { echo "tag=$TAG_VERSION, expected=$RELEASE_VERSION" >&2; exit 1; }

      - name: Commit release version
        if: steps.release_history.outputs.has_release_tag == 'true'
        env:
          RELEASE_VERSION: ${{ steps.tag_version.outputs.new_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: release v${RELEASE_VERSION} [skip ci]"

      - name: Create and push release tag
        if: steps.release_history.outputs.has_release_tag == 'true'
        env:
          NEW_TAG: ${{ steps.tag_version.outputs.new_tag }}
        run: |
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin HEAD:main
          git push origin "$NEW_TAG"

      - name: Smoke-test CLI
        if: steps.release_history.outputs.has_release_tag == 'true'
        run: |
          node ./bin/vkd-skills.js list
          node ./bin/vkd-skills.js version

      - name: Publish @vkdatta/skills to npm
        if: steps.release_history.outputs.has_release_tag == 'true'
        run: npm publish
